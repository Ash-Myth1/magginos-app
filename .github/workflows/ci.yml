name: Maggino's CI/CD Pipeline

# 1. When should this run? Every time you push to the main branch!
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Automated Safety Checks
    runs-on: ubuntu-latest

    steps:
    # 2. Grab the latest code from your repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3. Spin up a virtual Node.js server
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 4. Install all the packages (React, Firebase, Framer Motion, etc.)
    - name: Install Dependencies
      run: npm ci

    # 5. The Ultimate Test: Run the TypeScript compiler and attempt a production build.
    # If there are any broken variables or missing files, this will fail and protect the live site!
    - name: Run TypeScript Check & Production Build
      run: npm run build